<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore Kenya - Order Confirmation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🛒 TechStore Kenya</h1>
    </header>

    <main>

        <div class="confirmation-container">

            <div class="success-icon">
                🎉
            </div>

            <h2>Order Successful!</h2>

            <p>
                Thank you, <strong id="customerName"></strong>!
            </p>

            <p>
                Your order has been received successfully.
            </p>

            <div class="order-number">
                Order Number:
                <strong id="orderNumber"></strong>
            </div>

            <div class="confirmation-summary">

                <h3>Order Details</h3>

                <div id="confirmationItems"></div>

                <hr>

                <h3 class="confirmation-total">
                    Total: KSh
                    <span id="confirmationTotal">0</span>
                </h3>

            </div>

            <button id="continueShoppingBtn">
                Continue Shopping 🛍️
            </button>

        </div>

    </main>

    <script src="order-confirmation.js"></script>

</body>

</html>

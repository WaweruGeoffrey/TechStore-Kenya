<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wishlist - TechStore Kenya</title><link rel="stylesheet" href="style.css"></head><body>
<header><nav><div class="logo"><h2>TechStore Kenya</h2></div><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a href="cart.html" id="cartCount">Cart (0)</a></li></ul></nav></header>
<main><section class="featured-products"><h1>My Wishlist ❤️</h1><p class="page-subtitle">Save products you want to buy later.</p><div class="products" id="wishlistContainer"></div></section></main>
<script src="products.js"></script><script src="app.js"></script><script>
function renderWishlist(){const ids=JSON.parse(localStorage.getItem('wishlist'))||[];const box=document.getElementById('wishlistContainer');const items=products.filter(p=>ids.includes(p.id));if(!items.length){box.innerHTML='<div class="no-products"><h2>Your wishlist is empty ❤️</h2><p>Browse our products and save your favourites.</p><a class="view-btn" href="products.html">Shop Products</a></div>';return;}box.innerHTML=items.map(p=>`<article class="product-card"><div class="product-image-wrap"><span class="product-badge">${p.badge||'Saved'}</span><button class="wishlist-btn liked" onclick="toggleWishlist(${p.id});renderWishlist()">♥</button><a href="product.html?id=${p.id}"><img src="${p.image}" alt="${p.name}"></a></div><div class="product-info"><span class="product-category">${p.category}</span><h3>${p.name}</h3><p class="price">KSh ${p.price.toLocaleString()}</p><button class="cart-btn" onclick="addToCart(${p.id})">Add to Cart</button></div></article>`).join('');}renderWishlist();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - TechStore Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <div class="logo">
            <h2>TechStore Kenya</h2>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="cart.html" id="cartCount">Cart (0)</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="featured-products">

        <h2>Contact TechStore Kenya</h2>

        <p>
            Have a question about our products or your order?
            We'd love to hear from you.
        </p>

        <br>

        <p>
            <strong>Email:</strong>
            wawerugeoffrey505@gmail.com
        </p>

        <p>
            <strong>Phone:</strong>
            +254 795 169 251
        </p>

        <p>
            <strong>Location:</strong>
            Kenya
        </p>

        <br>

        <h3>Send Us a Message</h3>

        <br>

        <form>

            <input
                type="text"
                placeholder="Your Name"
                required
                style="padding:12px; width:80%; max-width:600px; margin:8px;"
            >

            <br>

            <input
                type="email"
                placeholder="Your Email"
                required
                style="padding:12px; width:80%; max-width:600px; margin:8px;"
            >

            <br>

            <textarea
                placeholder="Your Message"
                required
                style="padding:12px; width:80%; max-width:600px; height:120px; margin:8px;"
            ></textarea>

            <br>

            <button
                type="submit"
                class="cart-btn"
                style="margin-top:10px;"
            >
                Send Message
            </button>

        </form>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
